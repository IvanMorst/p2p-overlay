[project]
name = "p2p-overlay"
version = "0.1.0"
description = "Защищённая оверлейная сеть передачи данных на основе пиринговых протоколов"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=5.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
overlay = "overlay.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true