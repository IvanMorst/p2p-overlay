[node]
node_id_bits = 160
state_dir = "./state"

[network]
listen_host = "0.0.0.0"
listen_port = 7000
connect_timeout_seconds = 5.0
request_timeout_seconds = 5.0
max_frame_payload = 65536
bootstrap_peers = []

[dht]
k_bucket_size = 3
alpha = 3
replication_factor = 3
record_ttl_seconds = 180
refresh_interval_seconds = 60
republish_fraction = 0.5